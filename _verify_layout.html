<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T33 本番レイアウト検証</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
      crossorigin="anonymous">
</head>
<body>
<!-- 本番 index.html と同一の body 構造(.gaugebar / .mid / 全幅 #map)でヘッドアップを再現する -->
<header>
  <h1>T33 本番レイアウト検証</h1>
  <button id="panel-toggle" type="button">☰ 記録</button>
  <button id="s1">セッション1描画(広域)</button>
  <span id="status"></span>
</header>
<div class="layout">
<aside id="panel" class="closed">
  <div id="panel-list"></div>
</aside>
<div class="main">
<div id="error"></div>
<div id="warnings" class="warn"></div>
<div class="gaugebar">
  <div class="gauge"><span class="k">速度</span><span class="v" id="g-speed">--</span><span class="u">km/h</span></div>
  <div class="gauge"><span class="k">回転</span><span class="v" id="g-rpm">--</span><span class="u">rpm</span></div>
  <div class="gauge"><span class="k">水温</span><span class="v" id="g-coolant">--</span><span class="u">℃</span></div>
  <div class="gauge"><span class="k">スロットル</span><span class="v" id="g-throttle">--</span><span class="u">%</span></div>
  <div class="gauge"><span class="k">HV状態</span><span class="v" id="g-hv">--</span></div>
  <div class="gauge"><span class="k">時刻</span><span class="v" id="g-time">0.0</span><span class="u">s</span></div>
</div>
<div class="mid">
  <video id="video" controls playsinline></video>
  <canvas id="graph"></canvas>
</div>
<div id="map" class="nomap"></div>
</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
        crossorigin="anonymous"></script>
<script type="module">
import { renderViewer } from "./js/viewer.js";

// 実データに近い広域の折れ線(習志野→千葉方面を模した緩いカーブ)。約240点。
function mkModel() {
  const samples = [], graph = [], track = [];
  const lat0 = 35.681, lon0 = 140.02;
  for (let i = 0; i <= 240; i++) {
    const t = i;
    const speed = 30 + 20 * Math.sin(i / 15);
    const rpm = 1200 + 600 * Math.sin(i / 8);
    samples.push({ t, speed, rpm, coolant: 80, throttle: 20, hv_state: i % 2 });
    graph.push({ t, speed, rpm });
    // 緩く蛇行しながら南西へ(方位が変化する広域トラック)
    const lat = lat0 - i * 0.0004 + 0.004 * Math.sin(i / 20);
    const lon = lon0 - i * 0.0006 + 0.004 * Math.cos(i / 20);
    track.push({ t, lat, lon });
  }
  return { samples, graph, track, warnings: [] };
}
const M = mkModel();
const video = document.getElementById("video");
Object.defineProperty(video, "videoWidth", { get: () => 0 });
Object.defineProperty(video, "videoHeight", { get: () => 0 });
const status = document.getElementById("status");
document.getElementById("s1").onclick = () => { renderViewer(M, null); status.textContent = "描画完了(広域トラック)"; };

// --- サイドパネル検証: モック日付2日×セッション計3件で本番と同じ結線を再現する ---
import { createSessionPanel } from "./js/panel.js";
const mockSessions = {
  d1: [
    { stem: "t33_20260711_090000", timeLabel: "09:00:00", dateLabel: "2026-07-11", mp4s: [{}, {}] },
    { stem: "t33_20260711_140000", timeLabel: "14:00:00", dateLabel: "2026-07-11", mp4s: [] },
  ],
  d2: [ { stem: "t33_20260628_100000", timeLabel: "10:00:00", dateLabel: "2026-06-28", mp4s: [{}] } ],
};
const panel = createSessionPanel({
  listEl: document.getElementById("panel-list"),
  loadSessions: async (d) => mockSessions[d.id] || [],
  onSelect: (s) => { renderViewer(M, null); status.textContent = `選択: ${s.stem}`; },
});
panel.setDates([
  { id: "d1", name: "20260711", label: "2026-07-11" },
  { id: "d2", name: "20260628", label: "2026-06-28" },
]);
document.getElementById("panel").classList.remove("closed");
panel.expandDate({ id: "d1", name: "20260711", label: "2026-07-11" }, { autoSelectFirst: true });
// 記録時間は本番でも CSV 取得後に遅れて届く。長短の両極(15分台と1分台)で桁を確認する。
setTimeout(() => {
  panel.setDuration("t33_20260711_090000", 938); // 15分38秒
  panel.setDuration("t33_20260711_140000", 99);  // 1分39秒(動画なし)
}, 300);
document.getElementById("panel-toggle").onclick = () =>
  document.getElementById("panel").classList.toggle("closed");
</script>
</body>
</html>
