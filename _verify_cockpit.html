<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端末画面パネルの実データ照合ハーネス</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 開発用ハーネス。白背景で固定(ダークモード追従なし)。 */
  :root { color-scheme: light; }
  body { background: #fff; color: #1f2328; padding: 12px; }
  .vh-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .vh-bar input[type="text"] { width: 30em; font: inherit; padding: 4px 6px; }
  .vh-bar input[type="number"] { width: 7em; font: inherit; padding: 4px 6px; }
  .vh-main { display: flex; gap: 14px; align-items: flex-start; }
  .vh-main video { width: 520px; height: auto; background: #000; border-radius: 8px; }
  #cockpit { height: 720px; }
  .vh-out { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre;
            background: #f8f8f6; border: 1px solid #e5e5e0; border-radius: 8px;
            padding: 10px; margin-top: 10px; overflow-x: auto; }
  .vh-status { color: #6b6353; font-size: .9rem; }
</style>
</head>
<body>

<div class="vh-bar">
  <label>セッションの接頭辞
    <input type="text" id="prefix" value="/log/102230/t33_20261128_102230">
  </label>
  <button id="load" type="button">読み込む</button>
  <label>t(秒) <input type="number" id="seek" value="600.5" step="0.1"></label>
  <button id="go" type="button">その時刻へ</button>
  <button id="stats" type="button">全区間の min/max を出す</button>
  <span class="vh-status" id="status"></span>
</div>

<div class="vh-main">
  <video id="video" controls playsinline></video>
  <div id="cockpit"></div>
</div>

<div class="vh-out" id="out">セッションの接頭辞を入れて「読み込む」を押す。
CAN ログ(_can.csv / _can.csv.gz)・_video.json・連番 mp4 を同じ接頭辞から取る。</div>

<script type="module">
import { parseCanSignalsFromBuffer, sampleCockpitAt, COCKPIT_COLS } from "./js/can-signals.js";
import { createCockpitPanel } from "./js/cockpit-panel.js";

const $ = (id) => document.getElementById(id);
const out = (text) => { $("out").textContent = text; };
const status = (text) => { $("status").textContent = text; };

const video = $("video");
const panel = createCockpitPanel($("cockpit"));
let grid = null;
let segments = []; // [{url, baseOffsetSec}]
let currentSeg = -1;

/** 最初に見つかった URL を返す。全部 404 なら null。 */
async function firstAvailable(urls) {
  for (const url of urls) {
    try {
      const res = await fetch(url, { method: "HEAD" });
      if (res.ok) return url;
    } catch { /* 次を試す */ }
  }
  return null;
}

async function load() {
  const prefix = $("prefix").value.trim();
  grid = null;
  panel.reset();
  status("_video.json を読み込み中…");
  const metaRes = await fetch(`${prefix}_video.json`);
  if (!metaRes.ok) { out(`_video.json が取れない: ${metaRes.status}`); return; }
  const meta = await metaRes.json();
  const startMs = meta.segments?.[0]?.start_ms ?? meta.video_start_ms;

  segments = (meta.segments || []).map((s) => ({
    url: `${prefix.replace(/[^/]+$/, "")}${s.file}`,
    baseOffsetSec: (s.start_ms - startMs) / 1000,
  }));

  status("CAN ログを読み込み中…");
  const canUrl = await firstAvailable([`${prefix}_can.csv.gz`, `${prefix}_can.csv`]);
  if (!canUrl) { out("CAN ログが取れない(_can.csv.gz / _can.csv)"); return; }
  const t0 = performance.now();
  const buf = await (await fetch(canUrl)).arrayBuffer();
  const fetched = performance.now();
  const signals = await parseCanSignalsFromBuffer(buf, startMs);
  const parsed = performance.now();
  grid = signals.cockpit;

  out(
    [
      `CAN: ${canUrl}  ${(buf.byteLength / 1e6).toFixed(1)} MB`,
      `startMs(=_video.json の最初の segment.start_ms): ${startMs}`,
      `取得 ${(fetched - t0).toFixed(0)} ms / 解析 ${(parsed - fetched).toFixed(0)} ms`,
      `グリッド: ${grid.rows} 行 × ${grid.colCount} 列 (${grid.hz}Hz, ` +
        `${((grid.rows * grid.colCount * 4) / 1e6).toFixed(2)} MB) ` +
        `firstRow=${grid.firstRow} lastRow=${grid.lastRow} ` +
        `= ${(grid.firstRow / grid.hz).toFixed(2)}〜${(grid.lastRow / grid.hz).toFixed(2)} 秒`,
      `100Hz 配列: speed=${signals.speed.length} yaw=${signals.yaw.length} ` +
        `frontTorque=${signals.frontTorque.length} rearTorque=${signals.rearTorque.length}`,
      `セグメント: ${segments.map((s) => `${s.baseOffsetSec.toFixed(3)}s`).join(" / ")}`,
    ].join("\n")
  );
  status("読み込み完了");
  seekTo(Number($("seek").value) || 0);
}

/** グローバル時刻 t(秒)の位置へ動画を合わせる。 */
function seekTo(t) {
  if (segments.length === 0) return;
  let idx = 0;
  for (let i = 0; i < segments.length; i++) if (segments[i].baseOffsetSec <= t) idx = i;
  const local = t - segments[idx].baseOffsetSec;
  if (idx !== currentSeg) {
    currentSeg = idx;
    video.src = segments[idx].url;
    video.load();
    video.addEventListener("loadedmetadata", () => { video.currentTime = Math.max(0, local); }, { once: true });
  } else {
    video.currentTime = Math.max(0, local);
  }
}

/** 再生位置のグローバル時刻。 */
function globalTime() {
  if (currentSeg < 0) return 0;
  return segments[currentSeg].baseOffsetSec + (video.currentTime || 0);
}

function loop() {
  const t = globalTime();
  panel.update(sampleCockpitAt(grid, t), t);
  requestAnimationFrame(loop);
}

/** 全区間の min/max。独立実装(Python)の結果と突き合わせるために出す。 */
function printStats() {
  if (!grid) { out("先に読み込む"); return; }
  const names = Object.keys(COCKPIT_COLS);
  const rows = [`${"列".padEnd(14)} ${"件数".padStart(8)} ${"min".padStart(11)} ${"max".padStart(11)}`];
  for (const name of names) {
    const col = COCKPIT_COLS[name];
    let n = 0, lo = Infinity, hi = -Infinity;
    for (let row = 0; row < grid.rows; row++) {
      const v = grid.data[row * grid.colCount + col];
      if (!Number.isFinite(v)) continue;
      n++;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    rows.push(
      `${name.padEnd(14)} ${String(n).padStart(8)} ` +
        `${(n ? lo.toFixed(2) : "-").padStart(11)} ${(n ? hi.toFixed(2) : "-").padStart(11)}`
    );
  }
  // 後退区間(前モータ回転 < -5)の洗い出し。時刻合わせの検算に使う。
  const runs = [];
  let start = null;
  for (let row = 0; row < grid.rows; row++) {
    const v = grid.data[row * grid.colCount + COCKPIT_COLS.frontRpm];
    const neg = Number.isFinite(v) && v < -5;
    if (neg && start === null) start = row;
    if (!neg && start !== null) {
      if ((row - start) / grid.hz > 1) runs.push([start / grid.hz, row / grid.hz]);
      start = null;
    }
  }
  rows.push("", `後退区間(前回転 < -5 rpm, 1秒超): ${runs.map(([a, b]) => `${a.toFixed(2)}〜${b.toFixed(2)}s`).join(", ") || "なし"}`);

  // シフト R の区間
  const rRuns = [];
  start = null;
  for (let row = 0; row < grid.rows; row++) {
    const v = grid.data[row * grid.colCount + COCKPIT_COLS.shift];
    const isR = v === 1;
    if (isR && start === null) start = row;
    if (!isR && start !== null) {
      if ((row - start) / grid.hz > 1) rRuns.push([start / grid.hz, row / grid.hz]);
      start = null;
    }
  }
  rows.push(`シフト R の区間(1秒超): ${rRuns.map(([a, b]) => `${a.toFixed(2)}〜${b.toFixed(2)}s`).join(", ") || "なし"}`);
  out(rows.join("\n"));
}

$("load").addEventListener("click", () => { load().catch((e) => out(String(e.stack || e))); });
$("go").addEventListener("click", () => seekTo(Number($("seek").value) || 0));
$("stats").addEventListener("click", printStats);
window.addEventListener("resize", () => panel.resize());
loop();
</script>
</body>
</html>
